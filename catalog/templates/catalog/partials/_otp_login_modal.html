<!-- OTP Login Modal -->
<div id="otpModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="relative w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden transform transition-all">
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-gray-50/50">
            <h3 id="otpModalTitle" class="text-lg font-bold text-gray-800">ورود / ثبت‌نام</h3>
            <button type="button" onclick="closeOtpModal()" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-lg hover:bg-gray-100">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div class="p-6">
            <!-- Alert Message -->
            <div id="otpAlert" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

            <!-- Step 1: Phone Number -->
            <div id="otpStepPhone">
                <p class="text-sm text-gray-600 mb-4">برای ورود یا عضویت، شماره موبایل خود را وارد کنید.</p>
                <div class="mb-4">
                    <label for="otpPhoneNumber" class="block text-xs font-semibold text-gray-700 mb-1">شماره موبایل</label>
                    <div class="relative">
                        <input type="tel" id="otpPhoneNumber" dir="ltr" maxlength="11" placeholder="۰۹۱۲۳۴۵۶۷۸۹"
                               class="w-full px-4 py-2.5 text-center text-gray-800 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-base tracking-wider">
                    </div>
                </div>
                <button type="button" id="btnSendOtp" onclick="handleSendOtp()"
                        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center space-x-2 space-x-reverse">
                    <span>دریافت کد تایید</span>
                </button>
            </div>

            <!-- Step 2: Verification Code -->
            <div id="otpStepCode" class="hidden">
                <div class="text-center mb-6">
                    <p class="text-sm text-gray-600 mb-1">کد تایید ۶ رقمی به شماره زیر ارسال شد:</p>
                    <div class="flex items-center justify-center space-x-2 space-x-reverse">
                        <span id="otpDisplayPhone" dir="ltr" class="font-bold text-gray-800 text-sm"></span>
                        <button type="button" onclick="changePhoneNumber()" class="text-xs text-blue-600 hover:underline">ویرایش شماره</button>
                    </div>
                </div>

                <!-- 6 Digits OTP Inputs -->
                <div class="flex justify-center gap-2 mb-6" dir="ltr">
                    <input type="text" maxlength="1" class="otp-digit w-11 h-12 text-center text-xl font-bold bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" data-index="0" inputmode="numeric" autocomplete="one-time-code">
                    <input type="text" maxlength="1" class="otp-digit w-11 h-12 text-center text-xl font-bold bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" data-index="1" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit w-11 h-12 text-center text-xl font-bold bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" data-index="2" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit w-11 h-12 text-center text-xl font-bold bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" data-index="3" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit w-11 h-12 text-center text-xl font-bold bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" data-index="4" inputmode="numeric">
                    <input type="text" maxlength="1" class="otp-digit w-11 h-12 text-center text-xl font-bold bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" data-index="5" inputmode="numeric">
                </div>

                <button type="button" id="btnVerifyOtp" onclick="handleVerifyOtp()"
                        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center space-x-2 space-x-reverse mb-4">
                    <span>تایید و ورود</span>
                </button>

                <!-- Resend & Timer -->
                <div class="text-center text-xs text-gray-500">
                    <div id="otpTimerWrapper">
                        <span>ارسال مجدد کد پس از: </span>
                        <span id="otpTimer" class="font-bold text-gray-700">۰۲:۰۰</span>
                    </div>
                    <button type="button" id="btnResendOtp" onclick="handleSendOtp(true)" class="hidden text-blue-600 font-semibold hover:underline">
                        ارسال مجدد کد تایید
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let otpCountdownInterval = null;
    let currentOtpPhone = "";

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function toEnglishDigits(str) {
        if (!str) return "";
        const persianNumbers = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (let i = 0; i < 10; i++) {
            str = str.replace(persianNumbers[i], i).replace(arabicNumbers[i], i);
        }
        return str;
    }

    function showOtpAlert(message, isError = true) {
        const alertEl = document.getElementById('otpAlert');
        if (!alertEl) return;
        alertEl.textContent = message;
        alertEl.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border', 'border-red-200', 'bg-green-50', 'text-green-700', 'border-green-200');
        if (isError) {
            alertEl.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
        } else {
            alertEl.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
        }
    }

    function hideOtpAlert() {
        const alertEl = document.getElementById('otpAlert');
        if (alertEl) {
            alertEl.classList.add('hidden');
            alertEl.textContent = '';
        }
    }

    function openOtpModal() {
        hideOtpAlert();
        changePhoneNumber();
        const modal = document.getElementById('otpModal');
        if (modal) modal.classList.remove('hidden');
        const phoneInput = document.getElementById('otpPhoneNumber');
        if (phoneInput) {
            phoneInput.value = '';
            setTimeout(() => phoneInput.focus(), 100);
        }
    }

    function closeOtpModal() {
        const modal = document.getElementById('otpModal');
        if (modal) modal.classList.add('hidden');
        if (otpCountdownInterval) clearInterval(otpCountdownInterval);
    }

    function changePhoneNumber() {
        hideOtpAlert();
        if (otpCountdownInterval) clearInterval(otpCountdownInterval);
        document.getElementById('otpStepPhone')?.classList.remove('hidden');
        document.getElementById('otpStepCode')?.classList.add('hidden');
        document.querySelectorAll('.otp-digit').forEach(input => input.value = '');
    }

    function startTimer(seconds) {
        if (otpCountdownInterval) clearInterval(otpCountdownInterval);
        const timerEl = document.getElementById('otpTimer');
        const timerWrapper = document.getElementById('otpTimerWrapper');
        const resendBtn = document.getElementById('btnResendOtp');

        if (timerWrapper) timerWrapper.classList.remove('hidden');
        if (resendBtn) resendBtn.classList.add('hidden');

        let remaining = parseInt(seconds, 10) || 120;

        function updateDisplay() {
            const m = Math.floor(remaining / 60);
            const s = remaining % 60;
            if (timerEl) {
                timerEl.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            if (remaining <= 0) {
                clearInterval(otpCountdownInterval);
                if (timerWrapper) timerWrapper.classList.add('hidden');
                if (resendBtn) resendBtn.classList.remove('hidden');
            }
            remaining--;
        }

        updateDisplay();
        otpCountdownInterval = setInterval(updateDisplay, 1000);
    }

    function getEnteredOtp() {
        let code = '';
        document.querySelectorAll('.otp-digit').forEach(input => {
            code += toEnglishDigits(input.value.trim());
        });
        return code;
    }

    // OTP Inputs Navigation
    document.addEventListener('DOMContentLoaded', () => {
        const digitInputs = document.querySelectorAll('.otp-digit');
        digitInputs.forEach((input, idx) => {
            input.addEventListener('input', (e) => {
                const val = toEnglishDigits(e.target.value);
                e.target.value = val.slice(-1);
                if (val && idx < digitInputs.length - 1) {
                    digitInputs[idx + 1].focus();
                }
                if (getEnteredOtp().length === 6) {
                    handleVerifyOtp();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && idx > 0) {
                    digitInputs[idx - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = toEnglishDigits(e.clipboardData.getData('text')).replace(/\D/g, '');
                if (pasteData.length === 6) {
                    pasteData.split('').forEach((char, i) => {
                        if (digitInputs[i]) digitInputs[i].value = char;
                    });
                    digitInputs[5].focus();
                    handleVerifyOtp();
                }
            });
        });
    });

    async function handleSendOtp(isResend = false) {
        hideOtpAlert();
        let phone = "";
        if (isResend) {
            phone = currentOtpPhone;
        } else {
            const phoneInput = document.getElementById('otpPhoneNumber');
            phone = toEnglishDigits(phoneInput.value.trim());
        }

        if (!phone || !/^09\d{9}$/.test(phone)) {
            showOtpAlert('لطفاً یک شماره موبایل معتبر ۱۱ رقمی (شروع با ۰۹) وارد کنید.');
            return;
        }

        const btn = isResend ? document.getElementById('btnResendOtp') : document.getElementById('btnSendOtp');
        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="animate-pulse">در حال ارسال...</span>';

        try {
            const response = await fetch("{% url 'accounts:send_otp' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },
                body: JSON.stringify({ phone: phone })
            });
            const data = await response.json();

            if (response.ok && (data.success === true || data.status === "success")) {
                currentOtpPhone = phone;
                document.getElementById('otpDisplayPhone').textContent = phone;
                document.getElementById('otpStepPhone').classList.add('hidden');
                document.getElementById('otpStepCode').classList.remove('hidden');
                startTimer(data.cooldown || 120);
                setTimeout(() => {
                    const firstInput = document.querySelector('.otp-digit');
                    if (firstInput) firstInput.focus();
                }, 100);
            } else {
                showOtpAlert(data.message || 'خطایی در ارسال کد رخ داد.');
            }
        } catch (err) {
            showOtpAlert('خطای ارتباط با سرور. لطفاً اتصال اینترنت خود را بررسی کنید.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = origText;
        }
    }

    async function handleVerifyOtp() {
        hideOtpAlert();
        const code = getEnteredOtp();
        if (code.length !== 6) {
            showOtpAlert('لطفاً کد تایید ۶ رقمی را به طور کامل وارد کنید.');
            return;
        }

        const btn = document.getElementById('btnVerifyOtp');
        const origText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="animate-pulse">در حال بررسی...</span>';

        try {
            const response = await fetch("{% url 'accounts:verify_otp' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie("csrftoken")
                },
                body: JSON.stringify({ phone: currentOtpPhone, code: code })
            });
            const data = await response.json();

            if (response.ok && (data.success === true || data.status === "success")) {
                showOtpAlert('ورود با موفقیت انجام شد. در حال انتقال...', false);
                setTimeout(() => {
                    window.location.href = data.redirect_url || window.location.href;
                }, 1000);
            } else {
                showOtpAlert(data.message || 'کد وارد شده نامعتبر یا منقضی شده است.');
            }
        } catch (err) {
            showOtpAlert('خطای ارتباط با سرور. لطفاً مجدداً تلاش کنید.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = origText;
        }
    }
</script>
