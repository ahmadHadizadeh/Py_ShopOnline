<!-- OTP Login Modal -->
{% csrf_token %}
<div
    id="otp-modal"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-labelledby="otp-modal-title"
    data-send-endpoint="{% url 'accounts:send_otp' %}"
    data-verify-endpoint="{% url 'accounts:verify_otp' %}"
    class="fixed inset-0 z-50 flex items-center justify-center hidden bg-black/60 backdrop-blur-sm transition-opacity duration-300"
>
    <div class="relative w-full max-w-md p-6 mx-4 bg-white rounded-2xl shadow-2xl transform transition-all duration-300 scale-95 opacity-0" id="otp-modal-content">
        
        <!-- دکمه بستن -->
        <button type="button" data-otp-action="close" aria-label="بستن پنجره ورود" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-full hover:bg-gray-100">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <!-- مرحله اول: دریافت شماره موبایل -->
        <div id="otp-step-1" class="space-y-5">
            <div class="text-center">
                <h3 id="otp-modal-title" class="text-xl font-bold text-gray-800">ورود / ثبت‌نام سریع</h3>
                <p class="text-sm text-gray-500 mt-2">شماره موبایل خود را جهت دریافت کد تأیید وارد کنید</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="otp-phone" class="block text-sm font-medium text-gray-700 mb-1">شماره موبایل</label>
                    <input type="tel" id="otp-phone" name="phone" placeholder="09xxxxxxxxx" maxlength="11"
                           class="w-full px-4 py-3 text-left border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-base tracking-wider font-mono dir-ltr">
                </div>

                <button type="button" id="btn-send-otp" data-otp-action="send"
                        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl transition duration-200 flex items-center justify-center space-x-2">
                    <span>ارسال کد تأیید</span>
                </button>
            </div>
        </div>

        <!-- مرحله دوم: ورود کد تأیید ۶ رقمی -->
        <div id="otp-step-2" class="space-y-5 hidden">
            <div class="text-center">
                <h3 class="text-xl font-bold text-gray-800">کد تأیید را وارد کنید</h3>
                <p class="text-sm text-gray-500 mt-2">
                    کد ۶ رقمی ارسال شده به <span id="display-phone" class="font-bold text-gray-700 font-mono dir-ltr"></span> را وارد نمایید
                </p>
            </div>

            <!-- باکس‌های ورودی ۶ رقمی؛ ورود از چپ به راست -->
            <div id="otp-inputs-container"
            dir="ltr"
            class="flex flex-row justify-center gap-2 my-4">

            <input type="text" maxlength="1" inputmode="numeric" dir="ltr"
                  autocomplete="one-time-code"
                  class="otp-digit w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none transition font-mono">

            <input type="text" maxlength="1" inputmode="numeric" dir="ltr"
                  class="otp-digit w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none transition font-mono">

            <input type="text" maxlength="1" inputmode="numeric" dir="ltr"
                  class="otp-digit w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none transition font-mono">

            <input type="text" maxlength="1" inputmode="numeric" dir="ltr"
                  class="otp-digit w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none transition font-mono">

            <input type="text" maxlength="1" inputmode="numeric" dir="ltr"
                  class="otp-digit w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none transition font-mono">

            <input type="text" maxlength="1" inputmode="numeric" dir="ltr"
                  class="otp-digit w-12 h-12 text-center text-xl font-bold border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-500 outline-none transition font-mono">
            </div>

            <div class="flex items-center justify-between text-sm px-1">
                <button type="button" data-otp-action="change-phone" class="text-blue-600 hover:text-blue-800 transition">
                    تغییر شماره موبایل
                </button>
                <div id="otp-timer-container" class="text-gray-500 text-xs">
                    ارسال مجدد کد پس از <span id="otp-timer" class="font-bold text-gray-700 font-mono">02:00</span>
                </div>
                <button type="button" id="btn-resend" data-otp-action="send" class="text-blue-600 hover:text-blue-800 transition hidden font-medium">
                    ارسال مجدد کد
                </button>
            </div>

            <button type="button" id="btn-verify-otp" data-otp-action="verify"
                    class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-medium rounded-xl transition duration-200 flex items-center justify-center space-x-2">
                <span>تأیید و ورود</span>
            </button>
        </div>

        <!-- پیام خطا / اطلاع‌رسانی -->
        <div id="otp-alert" class="mt-4 p-3 rounded-xl text-sm hidden transition duration-200 text-center"></div>

    </div>
</div>
