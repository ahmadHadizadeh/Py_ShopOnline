name: Phase 2 Admin Verify

on:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Django==6.0.6 pytest pytest-django Pillow python-dotenv requests jdatetime

      - name: Django checks
        run: python manage.py check

      - name: Contract and admin tests
        run: pytest accounts/tests.py cart/tests.py orders/tests.py -q
