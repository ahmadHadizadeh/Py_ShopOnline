name: PostgreSQL concurrency verification

on:
  push:
    branches:
      - phase-3-8-dashboard-payment-integration
      - ui/storefront-header-search-navigation-2026-11-07
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: pyshop_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pyshop_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DB_ENGINE: postgresql
      DB_NAME: pyshop_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_TEST_NAME: pyshop_test_db
      PAYMENT_DEFAULT_GATEWAY: mock_gateway
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project test dependencies and PostgreSQL driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django==6.0.6" pytest pytest-django Pillow python-dotenv requests jdatetime "psycopg[binary]"

      - name: Confirm PostgreSQL backend
        run: |
          python -c "import os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'core.settings'); import django; django.setup(); from django.db import connection; assert connection.vendor == 'postgresql', connection.vendor; print('Database backend:', connection.vendor)"

      - name: Run Django system checks
        run: python manage.py check

      - name: Run PostgreSQL-only concurrency and transaction tests
        run: pytest -q orders/test_postgresql_concurrency.py
