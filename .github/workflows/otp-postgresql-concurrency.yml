name: OTP PostgreSQL concurrency verification

on:
  pull_request:
    paths:
      - "accounts/services/otp.py"
      - "accounts/otp_views.py"
      - "accounts/tests.py"
      - "core/settings.py"
      - ".github/workflows/otp-postgresql-concurrency.yml"

permissions:
  contents: read

jobs:
  otp-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: pyshop_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pyshop_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: core.settings
      DB_ENGINE: postgresql
      DB_NAME: pyshop_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project test dependencies and PostgreSQL driver
        run: |
          python -m pip install "Django==6.0.6" pytest pytest-django Pillow python-dotenv requests jdatetime "psycopg[binary]"

      - name: Confirm PostgreSQL backend
        run: |
          python -c "import django; django.setup(); from django.db import connection; assert connection.vendor == 'postgresql', connection.vendor; print('POSTGRESQL_BACKEND_OK')"

      - name: Run OTP concurrency tests on PostgreSQL
        run: |
          pytest -q accounts/tests.py -k "concurrent_otp or otp_wrong_attempt_counter"
