name: Storefront Tailwind CSS build

on:
  push:
    branches:
      - "ui/storefront-header-search-navigation-2026-11-07"
    paths:
      - ".github/workflows/storefront-tailwind-build.yml"
      - "tailwind.config.js"
      - "frontend/tailwind.css"
      - "accounts/templates/**/*.html"
      - "cart/templates/**/*.html"
      - "catalog/templates/catalog/**/*.html"
      - "orders/templates/orders/payment/**/*.html"
      - "static/js/**/*.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storefront-tailwind-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/ui/storefront-header-search-navigation-2026-11-07'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the source branch
        uses: actions/checkout@v4

      - name: Download and verify the pinned Tailwind CLI
        shell: bash
        run: |
          set -euo pipefail

          version="3.4.17"
          asset="tailwindcss-linux-x64"
          release_url="https://github.com/tailwindlabs/tailwindcss/releases/download/v${version}"

          curl --fail --show-error --silent --location --retry 3 \
            "${release_url}/${asset}" \
            --output "${RUNNER_TEMP}/${asset}"
          curl --fail --show-error --silent --location --retry 3 \
            "${release_url}/sha256sums.txt" \
            --output "${RUNNER_TEMP}/tailwindcss-sha256sums.txt"

          grep -E "[[:space:]]+[*]?${asset}$" \
            "${RUNNER_TEMP}/tailwindcss-sha256sums.txt" \
            > "${RUNNER_TEMP}/tailwindcss.sha256"

          test "$(wc -l < "${RUNNER_TEMP}/tailwindcss.sha256")" -eq 1
          (
            cd "${RUNNER_TEMP}"
            sha256sum --check tailwindcss.sha256
          )

          chmod +x "${RUNNER_TEMP}/${asset}"
          "${RUNNER_TEMP}/${asset}" --help >/dev/null

      - name: Compile the production CSS
        shell: bash
        run: |
          set -euo pipefail

          "${RUNNER_TEMP}/tailwindcss-linux-x64" \
            --config ./tailwind.config.js \
            --input ./frontend/tailwind.css \
            --output ./static/css/tailwind.min.css \
            --minify

          test -s ./static/css/tailwind.min.css

      - name: Verify representative storefront and runtime selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path("static/css/tailwind.min.css").read_text(encoding="utf-8")
          required = (
              ".hidden",
              ".bg-indigo-600",
              ".md\\:flex",
              ".sm\\:block",
              ".hover\\:text-indigo-600",
              ".bg-red-50",
              ".text-green-700",
              ".pointer-events-none",
              ".rotate-180",
              ".grid-cols-1",
          )
          missing = [selector for selector in required if selector not in css]
          if missing:
              raise SystemExit(
                  "Tailwind output is missing required storefront selectors: "
                  + ", ".join(missing)
              )
          print(
              f"Tailwind CSS verification passed: {len(required)} required selectors found; "
              f"{len(css)} bytes generated."
          )
          PY

      - name: Commit only the generated static CSS
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- static/css/tailwind.min.css

          if git diff --cached --quiet; then
            echo "Generated Tailwind CSS is already up to date."
          else
            git commit -m "Build static Tailwind CSS v3.4.17"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
