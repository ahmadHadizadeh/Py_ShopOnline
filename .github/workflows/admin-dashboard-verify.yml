name: Admin dashboard verification

on:
  push:
    branches:
      - phase-3-8-admin-dashboard-ux
      - phase-3-8-dashboard-payment-integration
      - fix/admin-ui-ux-2026-11-03
      - fix/payment-initiation-post-only-2026-11-03
      - fix/order-admin-audit-atomicity-2026-11-03
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django==6.0.6" pytest pytest-django Pillow python-dotenv requests jdatetime

      - name: Run Django system checks
        run: python manage.py check

      - name: Check model and migration state
        run: python manage.py makemigrations --check --dry-run

      - name: Run focused shared-variant stock regression tests
        run: >-
          pytest -q
          cart/tests.py::SharedProductVariantStockTests::test_quantity_update_counts_other_active_variants
          cart/tests.py::SharedProductVariantStockTests::test_saved_item_cannot_be_reactivated_above_shared_stock
          cart/tests.py::SharedProductVariantStockTests::test_checkout_rejects_aggregate_quantity_across_variants

      - name: Run automated test suite
        run: pytest -q
