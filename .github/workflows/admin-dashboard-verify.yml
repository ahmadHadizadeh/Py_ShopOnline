name: Admin dashboard verification

on:
  push:
    branches:
      - phase-3-8-admin-dashboard-ux
      - phase-3-8-dashboard-payment-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django==6.0.6" pytest pytest-django Pillow python-dotenv requests jdatetime

      - name: Run Django system checks
        run: python manage.py check

      - name: Run automated test suite
        run: pytest -q
