<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درگاه پرداخت شبیه‌سازی شده بانکی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Tahoma, sans-serif; }
        .num-latin { font-variant-numeric: lnum; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 p-6 text-white flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold">شبیه‌ساز درگاه پرداخت شاپرک</h1>
                <p class="text-xs text-blue-200 mt-1">محیط تست هوش برتر</p>
            </div>
        </div>

        <div class="p-8">
            <div class="bg-blue-50 rounded-xl p-5 mb-8 border border-blue-100">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-gray-600 text-sm">شماره سفارش:</span>
                    <span class="font-bold text-gray-800">{{ order_number }}</span>
                </div>
                <div class="flex justify-between items-center mb-3">
                    <span class="text-gray-600 text-sm">شناسه تراکنش:</span>
                    <span class="font-semibold text-gray-800 num-latin text-sm">{{ trxid }}</span>
                </div>
                <div class="flex justify-between items-center pt-3 border-t border-blue-200/50">
                    <span class="text-gray-600 text-sm">مبلغ قابل پرداخت:</span>
                    <span class="text-lg font-extrabold text-blue-800 num-latin">{{ amount|floatformat:0 }} تومان</span>
                </div>
            </div>

            <!-- تغییر متد به POST جهت همخوانی با ساختار ویوی درگاه برگشت و افزودن csrf_token -->
            <form action="{{ callback_url }}" method="POST" class="grid grid-cols-2 gap-4">
                {% csrf_token %}
                <input type="hidden" name="trxid" value="{{ trxid }}">
                
                <!-- دکمه موفقیت -->
                <button type="submit" name="status" value="success" 
                        class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-lg flex flex-col items-center justify-center">
                    <span>تراکنش موفق</span>
                </button>

                <!-- دکمه خطا -->
                <button type="submit" name="status" value="failed" 
                        class="w-full py-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition shadow-lg flex flex-col items-center justify-center">
                    <span>تراکنش ناموفق</span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
